<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <link rel="stylesheet" href="checkout.css">
</head>
<body>

  <div class="checkout-container">

    <!-- Billing Form -->
    <div class="box">
      <h2>Billing Details</h2>

      <div class="form-group">
        <input type="text" id="name" placeholder="Full Name">
      </div>

      <div class="form-group">
        <input type="email" id="email" placeholder="Email Address">
      </div>

      <div class="form-group">
        <input type="text" id="phone" placeholder="Phone Number">
      </div>

      <div class="form-group">
        <textarea id="address" rows="4" placeholder="Full Address"></textarea>
      </div>

      <div class="form-group">
        <select id="paymentMethod">
          <option value="Cash on Delivery">Cash on Delivery</option>
          <option value="UPI">UPI</option>
          <option value="Card">Credit / Debit Card</option>
        </select>
      </div>

      <button class="place-btn" onclick="placeOrder()">Place Order</button>
      <a href="cart.html" class="back-btn">← Back to Cart</a>
    </div>

    <!-- Order Summary -->
    <div class="box">
      <h2>Order Summary</h2>

      <div id="orderSummary"></div>

      <div class="subtotal-line">
        <span>Subtotal</span>
        <span>₹<span id="subtotalAmount">0</span></span>
      </div>

      <div class="shipping-line">
        <span>Shipping</span>
        <span>₹<span id="shippingAmount">30</span></span>
      </div>

      <div class="total">
        <span>Total</span>
        <span>₹<span id="finalTotal">0</span></span>
      </div>
    </div>
  </div>

  <script src="checkout.js"></script>
</body>
</html>
